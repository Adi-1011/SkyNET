<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Flights - SkyNET</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="search.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo-container">
            <img src="SkyNET.png" alt="SkyNET" id="logo">
        </div>

        <div class="hamburger" onclick="toggleMenu()">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
        </div>

        <ul class="navbar-list" id="navList">
            <li><a href="search.html" class="link-list">SEARCH</a></li>
            <li><a href="contact.html" class="link-list">CONTACT</a></li>
            <li><a href="deals2.html" class="link-list">DEALS</a></li>
            <li><a href="index.html" class="link-list">HOME</a></li>
            <a href="login.html" id="login">LOGIN</a>
            <a href="register.html" id="signin">SIGN-IN</a>
        </ul>
    </nav>

    <div class="search-area">
        <div class="trip">
            <h1 id="one-way" onclick="toggleTripType('one-way')">ONE-WAY TRIP</h1>
            <h1 id="round-trip" class="active" onclick="toggleTripType('round-trip')">ROUND TRIP</h1>
        </div>

        <div class="form-container">
            <div class="source-box">
                <i class="fa-solid fa-plane-departure"></i>
                <input type="text" id="source-field" placeholder="Enter Departure City">
            </div>

            <div class="source-box">
                <i class="fa-solid fa-plane-arrival"></i>
                <input type="text" id="destination-field" placeholder="Enter Arrival City">
            </div>

            <div class="departure-return">
                <div class="source-box">
                    <i class="fa-solid fa-calendar-days"></i>
                    <input type="date" id="departure-date" placeholder="Departure Date">
                </div>

                <div class="source-box" id="return-date-container">
                    <i class="fa-solid fa-calendar-days"></i>
                    <input type="date" id="return-date" placeholder="Return Date">
                </div>
            </div>

            <div class="source-box">
                <i class="fa-solid fa-users"></i>
                <input type="number" id="passenger-count" placeholder="Number of Passengers" min="1" value="1">
            </div>

            <div class="submit">
                <div class="promo-code">
                    <i class="fa-solid fa-tags"></i>
                    <input type="text" id="promo" placeholder="Promo Code (Optional)">
                </div>
                <a id="search-submit" href="destination.html">SEARCH FLIGHTS</a>
            </div>
        </div>
    </div>

    <footer class="footer-home">
        <h3 id="footerlogo"><b>SkyNET</b></h3>
        <ul class="footer-list">
            <li>Book Now</li>
            <li>Special Offers</li>
            <li>Destinations</li>
            <li>Customer Support</li>
            <li>About Us</li>
        </ul>
        <div class="footer-div">
            <p>© 2025 SkyNET. All rights reserved.</p>
            <p>Privacy Policy</p>
        </div>
    </footer>

    <script>

        // Hamburger menu toggle
        function toggleMenu() {
            const navList = document.getElementById('navList');
            const hamburger = document.querySelector('.hamburger');
            navList.classList.toggle('show');
            hamburger.classList.toggle('active');
        }

        // Close menu when clicking outside
        document.addEventListener('click', function (event) {
            const nav = document.querySelector('.navbar');
            const navList = document.getElementById('navList');
            const hamburger = document.querySelector('.hamburger');

            if (!nav.contains(event.target) && navList.classList.contains('show')) {
                navList.classList.remove('show');
                hamburger.classList.remove('active');
            }
        });

        // Close menu on resize
        window.addEventListener('resize', function () {
            const navList = document.getElementById('navList');
            const hamburger = document.querySelector('.hamburger');

            if (window.innerWidth > 991 && navList.classList.contains('show')) {
                navList.classList.remove('show');
                hamburger.classList.remove('active');
            }
        });

        // Toggle trip type
        function toggleTripType(type) {
            const oneWay = document.getElementById('one-way');
            const roundTrip = document.getElementById('round-trip');
            const returnDateContainer = document.getElementById('return-date-container');

            if (type === 'one-way') {
                oneWay.classList.add('active');
                roundTrip.classList.remove('active');
                returnDateContainer.classList.add('hidden');
            } else {
                roundTrip.classList.add('active');
                oneWay.classList.remove('active');
                returnDateContainer.classList.remove('hidden');
            }
        }

        // Form validation and submission
        document.getElementById('search-submit').addEventListener('click', function (e) {
            e.preventDefault();

            // Get form values
            const source = document.getElementById('source-field').value.trim();
            const destination = document.getElementById('destination-field').value.trim();
            const departureDate = document.getElementById('departure-date').value;
            const passengers = document.getElementById('passenger-count').value;

            // Validation
            if (!source || !destination || !departureDate || !passengers) {
                alert('Please fill in all required fields (Departure, Arrival, Date, and Passengers)');
                return;
            }

            if (parseInt(passengers) < 1) {
                alert('Please enter at least 1 passenger');
                return;
            }

            // Check if round trip and return date is needed
            const isRoundTrip = document.getElementById('round-trip').classList.contains('active');
            const returnDateVal = document.getElementById('return-date').value;

            if (isRoundTrip && !returnDateVal) {
                alert('Please select a return date for round trip');
                return;
            }

        
            const searchData = {
                from: source,              
                to: destination,          
                date: departureDate,       
                passengers: passengers
            };

            // Add return date if round trip
            if (isRoundTrip && returnDateVal) {
                searchData.returnDate = returnDateVal;
                searchData.tripType = 'round-trip';
            } else {
                searchData.tripType = 'one-way';
            }

            localStorage.setItem('flightSearchData', JSON.stringify(searchData));

            console.log('Search data saved to localStorage:', searchData);

            // Show confirmation
            alert('Searching for flights...\n\nFrom: ' + source + '\nTo: ' + destination + '\nDeparture: ' + departureDate + (isRoundTrip ? '\nReturn: ' + returnDateVal : ''));

            // Redirect to destination page
            window.location.href = 'destination.html';
        });

        // Set minimum date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('departure-date').setAttribute('min', today);
        document.getElementById('return-date').setAttribute('min', today);

        // Update return date minimum when departure date changes
        document.getElementById('departure-date').addEventListener('change', function () {
            document.getElementById('return-date').setAttribute('min', this.value);
        });
    </script>
</body>

</html>
